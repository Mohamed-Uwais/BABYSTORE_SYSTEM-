# Include in each existing POS/storefront server block. Keep its root and API proxy.
# Validate with nginx -t before reload. Do not add these headers to /api or /uploads.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# Vite fingerprints these filenames. Preserve old assets during deployments so
# an open POS session can still load a route without losing its unsaved sale.
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /images/hero/optimized/ {
    try_files $uri =404;
    types { image/avif avif; image/webp webp; }
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Existing SPA try_files fallback should resolve here. Never cache the app shell
# for a year: it contains references to the current release's chunks.
location = /index.html {
    add_header Cache-Control "no-cache";
}
