# REVIEW TEMPLATE, NOT INSTALLED. This assumes one public Nginx instance,
# no CDN, and an API bound to loopback:5001. Match the actual topology first.
# http {} context: one shared zone covers all Nginx/API workers on this host.
limit_req_zone $binary_remote_addr zone=littora_tracking:10m rate=30r/m;

# Place in the existing public server {} block (not beside the line above).
# Existing generic /api proxy MUST NOT use ^~ or it will bypass this regex.
location ~ ^/api/public/(track|track-live/[^/]+|repeat-order)/?$ {
    limit_req zone=littora_tracking burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    # Replace, do not append an untrusted browser-supplied forwarding header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
